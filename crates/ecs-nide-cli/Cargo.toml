[package]
name = "ecs-nide-cli"
description = "La ligne de commande `ecs-nide` : valider, planifier, obtenir un contrat, générer des données de test, importer des résultats."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ecs-nide"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
ecs-nide-core = { path = "../ecs-nide-core" }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true

[dev-dependencies]
tempfile.workspace = true
